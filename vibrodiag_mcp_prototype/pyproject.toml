[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibroagent-mcp"
version = "0.2.0"
description = "Edge building-vibration monitoring MCP application with multi-sensor relative analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
qwen = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../stdatalog_core", "../stdatalog_pnpl", "../stdatalog_dtk", ".."]

[tool.setuptools.package-data]
vibroagent_mcp = ["static/*.png"]
